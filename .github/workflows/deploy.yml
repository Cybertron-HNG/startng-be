name: Deploy (Coolify)

# Runs only after the Malware Scan (CI Gate) workflow finishes successfully
# on a push to main. Never deploys when the scan fails or is skipped.
on:
  workflow_run:
    workflows: ["Malware Scan (CI Gate)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Coolify deployment
        shell: bash
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${COOLIFY_WEBHOOK_URL:-}" ]]; then
            echo "COOLIFY_WEBHOOK_URL secret is not set"; exit 1
          fi
          # Safe to log: scheme, host and path only (no query string, no token)
          echo "Calling: ${COOLIFY_WEBHOOK_URL%%\?*}"
          AUTH=()
          if [[ -n "${COOLIFY_TOKEN:-}" ]]; then AUTH=(-H "Authorization: Bearer ${COOLIFY_TOKEN}"); fi
          CODE=$(curl --silent --show-error --max-time 60 -X POST -o /tmp/resp.txt -w '%{http_code}'             "${AUTH[@]}" "${COOLIFY_WEBHOOK_URL}") || true
          echo "HTTP status: ${CODE}"
          cat /tmp/resp.txt; echo
          if [[ "${CODE}" != 2* ]]; then
            echo "Coolify did not accept the deploy request"; exit 1
          fi
          echo "Deployment triggered"
