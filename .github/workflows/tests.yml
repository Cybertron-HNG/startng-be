name: Tests

on:
  pull_request:
    branches: [main, prod, staging, dev]
  push:
    branches: [main, prod, staging, dev]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4 pinned SHA

      # The Dockerfile runs Python 3.12; ubuntu-latest ships it, so no extra setup action is needed.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt

      # The tests use an in-memory SQLite database and never call GitHub, so no secrets or services are needed.
      - name: Run tests
        shell: bash
        run: .venv/bin/python -m pytest -q
