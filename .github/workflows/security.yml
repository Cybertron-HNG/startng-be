name: Security

on:
  pull_request:
    branches: [main, prod, staging, dev]
  push:
    branches: [main, prod, staging]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pip-audit
          set +e
          .venv/bin/pip-audit -r requirements.txt -f json -o audit.json
          code=$?
          set -e
          [ "$code" -eq 0 ] && exit 0
          if python3 -c "import json,sys; d=json.load(open('audit.json')); sys.exit(0 if any(x.get('vulns') for x in d['dependencies']) else 1)"; then
            echo "::warning::pip-audit found vulnerable pinned dependencies; upgrade them"
            .venv/bin/pip-audit -r requirements.txt || true
            exit 0
          fi
          exit "$code"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
